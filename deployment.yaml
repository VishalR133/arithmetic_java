apiVersion: apps/v1
kind: Deployment
metadata:
  name: arithmetic-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arithmetic-app
  template:
    metadata:
      labels:
        app: arithmetic-app
    spec: 
      containers:
      - name: java-app
        image: vishal133/java-app:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: arithmetic-service
spec:
  type: NodePort
  selector:
    app: arithmetic-app
  ports:
    - port: 80
      targetPort: 8080 
      nodePort: 30001  
